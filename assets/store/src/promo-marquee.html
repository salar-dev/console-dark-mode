<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>marquee 1400x560</title>
<link rel="stylesheet" href="promo.css">
<style>
  html, body { width: 1400px; height: 560px; }
  .tile { width: 1400px; height: 560px; padding: 0 110px 0 120px; gap: 84px; }
  .icon { width: 320px; height: 320px; }
  h1 { font-size: 76px; }
  p { margin-top: 18px; font-size: 27px; max-width: 760px; }
  .marks { margin-top: 36px; gap: 16px; }
  .marks img { width: 56px; height: 56px; }
  .chips { display: flex; gap: 12px; margin-top: 22px; }
  .chip { font-size: 17px; padding: 9px 16px; white-space: nowrap; }
</style></head>
<body>
<div class="tile">
  <img class="icon" src="../../icon/extension-icon.svg" alt="">
  <div class="text">
    <h1>Console Dark Mode</h1>
    <p>A carefully crafted dark theme for Google Play Console and App Store Connect. Toggle per console. Never touches other websites.</p>
    <div class="marks">
      <img src="../../../extension/popup/brand/play-console.svg" alt="">
      <img src="../../../extension/popup/brand/app-store-connect.svg" alt="">
      <span style="font-size:19px;margin-left:6px">One switch per console</span>
    </div>
    <div class="chips">
      <span class="chip">No white flash</span>
      <span class="chip">Follows system appearance</span>
      <span class="chip"><span class="kbd">Alt</span>+<span class="kbd">Shift</span>+<span class="kbd">D</span></span>
    </div>
  </div>
</div>
</body></html>
