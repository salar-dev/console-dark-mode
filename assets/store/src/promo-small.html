<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>promo 440x280</title>
<link rel="stylesheet" href="promo.css">
<style>
  html, body { width: 440px; height: 280px; }
  .tile { width: 440px; height: 280px; padding: 0 30px 0 26px; gap: 24px; }
  .icon { width: 140px; height: 140px; }
  h1 { font-size: 27px; }
  p { margin-top: 8px; font-size: 13.5px; }
  .marks { margin-top: 16px; gap: 9px; }
  .marks img { width: 28px; height: 28px; }
  .marks span { font-size: 11.5px; margin-left: 4px; white-space: nowrap; }
</style></head>
<body>
<div class="tile">
  <img class="icon" src="../../icon/extension-icon.svg" alt="">
  <div class="text">
    <h1>Console<br>Dark Mode</h1>
    <p>A real dark theme for Google Play Console and App&nbsp;Store&nbsp;Connect.</p>
    <div class="marks">
      <img src="../../../extension/popup/brand/play-console.svg" alt="">
      <img src="../../../extension/popup/brand/app-store-connect.svg" alt="">
      <span>One switch per console</span>
    </div>
  </div>
</div>
</body></html>
