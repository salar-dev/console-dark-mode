<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>Console Dark Mode</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" id="popup">

    <!-- Header: identity + master switch -->
    <header class="hero">
      <img class="hero__logo" src="brand/extension.svg" width="44" height="44" alt="">
      <div class="hero__text">
        <h1 class="hero__title">Console Dark Mode</h1>
        <p class="hero__subtitle">Play Console &amp; App Store Connect</p>
      </div>
      <button class="switch switch--large" id="toggle-enabled" role="switch" aria-checked="true"
              aria-label="Dark mode" title="Toggle dark mode (Alt+Shift+D)">
        <span class="switch__track"><span class="switch__knob"></span></span>
      </button>
    </header>

    <!-- Current tab status -->
    <div class="status" id="status" data-state="unsupported" aria-live="polite">
      <span class="status__dot" aria-hidden="true"></span>
      <span class="status__text" id="status-text">Checking this page…</span>
    </div>

    <!-- Per-site switches -->
    <section class="card" id="section-sites" aria-labelledby="sites-title">
      <h2 class="card__title" id="sites-title">Sites</h2>

      <div class="row" data-switch="toggle-site-playconsole">
        <img class="row__brand" src="brand/play-console.svg" width="34" height="34" alt="">
        <div class="row__text">
          <span class="row__label" id="label-play">Google Play Console</span>
          <span class="row__hint">play.google.com/console</span>
        </div>
        <button class="switch" id="toggle-site-playconsole" role="switch" aria-checked="true" aria-labelledby="label-play">
          <span class="switch__track"><span class="switch__knob"></span></span>
        </button>
      </div>

      <div class="row" data-switch="toggle-site-appstoreconnect">
        <img class="row__brand" src="brand/app-store-connect.svg" width="34" height="34" alt="">
        <div class="row__text">
          <span class="row__label" id="label-appstore">App Store Connect</span>
          <span class="row__hint">appstoreconnect.apple.com</span>
        </div>
        <button class="switch" id="toggle-site-appstoreconnect" role="switch" aria-checked="true" aria-labelledby="label-appstore">
          <span class="switch__track"><span class="switch__knob"></span></span>
        </button>
      </div>
    </section>

    <!-- Behaviour -->
    <section class="card" aria-labelledby="options-title">
      <h2 class="card__title" id="options-title">Options</h2>
      <div class="row" data-switch="toggle-follow-system">
        <span class="row__glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 3.75a8.25 8.25 0 0 1 0 16.5z" fill="currentColor"/>
          </svg>
        </span>
        <div class="row__text">
          <span class="row__label" id="label-follow">Follow system appearance</span>
          <span class="row__hint">Only while the system is dark</span>
        </div>
        <button class="switch" id="toggle-follow-system" role="switch" aria-checked="false" aria-labelledby="label-follow">
          <span class="switch__track"><span class="switch__knob"></span></span>
        </button>
      </div>
    </section>

    <!-- Footer: shortcut, version, credit -->
    <footer class="footer">
      <div class="footer__shortcut">
        <span>Shortcut</span>
        <kbd class="kbd" id="shortcut-key">Alt+Shift+D</kbd>
        <button class="link" id="shortcut-change" type="button">Change</button>
      </div>
      <div class="footer__meta">
        <span id="version"></span>
        <a class="link link--credit" href="https://github.com/salar-dev" target="_blank" rel="noopener noreferrer"
           title="Salar Dev on GitHub">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="currentColor">
            <path d="M8 .2a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.49c-2.23.48-2.7-.95-2.7-.95-.36-.92-.89-1.17-.89-1.17-.72-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.71 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 .2z"/>
          </svg>
          <span>Salar Dev</span>
        </a>
      </div>
    </footer>

  </main>
  <script src="../src/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
